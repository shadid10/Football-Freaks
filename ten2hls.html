<!DOCTYPE html>
<html>

<head>
    <title>JW Player - Sony Ten 2</title>
    <script src="https://cdn.jwplayer.com/libraries/KB5zFt7A.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #000;
        }

        #player {
            width: 100%;
            height: 100vh;
        }

        .info-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            z-index: 1000;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="info-bar">Sony Ten 2</div>
    <div id="player"></div>
    <script>
        var player = jwplayer("player");
        player.setup({
            playlist: [
                {
                    file: "https://drk6xq0vhn.gpcdn.net/live/ten_2_hd_720/index.m3u8",
                    type: "hls"
                }],
            width: "100%",
            height: "100%",
            aspectratio: "16:9",
            autostart: true,
            controls: true,
            displaytitle: true,
            title: "Sony Ten 2"
        });
    </script>
</body>

</html>
